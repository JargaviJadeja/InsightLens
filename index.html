<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsightLens — Powered by Gemini</title>
    <meta name="description" content="An AI-powered evidence and insight explorer using Gemini multimodal reasoning and Google Search grounding to analyze documents, evaluate claims, and verify facts." />
    <meta property="og:title" content="InsightLens — Powered by Gemini" />
    <meta property="og:description" content="An AI-powered evidence and insight explorer using Gemini multimodal reasoning and Google Search grounding to analyze documents, evaluate claims, and verify facts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased bg-[#f8fafd] text-[#202124] dark:bg-[#121316] dark:text-[#e8eaed]">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('insightlens_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
